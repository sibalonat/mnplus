<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <style>
      @keyframes reveal {
        0%, 45% { opacity: 0; }
        50%, 95% { opacity: 1; }
        100% { opacity: 0; }
      }
      .plus { 
        animation: reveal 4s infinite;
      }
    </style>
  </defs>
  <rect width="100" height="100" fill="#1d3557"/>
  <text x="25" y="72" font-family="monospace" font-size="60" font-weight="bold" fill="#e63946">[</text>
  <text x="75" y="72" font-family="monospace" font-size="60" font-weight="bold" fill="#e63946">]</text>
  <text class="plus" x="50" y="72" font-family="monospace" font-size="60" font-weight="bold" fill="#f4a261" text-anchor="middle">+</text>
</svg>
