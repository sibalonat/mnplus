name: Add Subscriber (Manual)

# Manual workflow - Add/remove subscribers from subscribers.json file
on:
  workflow_dispatch:
    inputs:
      email:
        description: 'Email address to add/remove'
        required: true
        type: string
      action:
        description: 'Action to perform'
        required: true
        type: choice
        default: 'add'
        options:
          - add
          - remove

permissions:
  contents: write

jobs:
  update-subscribers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Update subscribers file
        env:
          EMAIL: ${{ github.event.inputs.email }}
          ACTION: ${{ github.event.inputs.action }}
        run: |
          # Load or create subscribers.json
          if [ ! -f "subscribers.json" ]; then
            echo '{"subscribers":[]}' > subscribers.json
            echo "⚠️ subscribers.json not found, creating new file"
          fi
          
          # Update the JSON
          python3 << 'EOF'
          import json
          import os
          from datetime import datetime
          
          email = os.environ['EMAIL'].strip()
          action = os.environ['ACTION']
          
          with open('subscribers.json', 'r') as f:
              data = json.load(f)
          
          if action == 'add':
              if not any(sub['email'].lower() == email.lower() for sub in data['subscribers']):
                  data['subscribers'].append({
                      'email': email,
                      'subscribedAt': datetime.now().strftime('%Y-%m-%d')
                  })
                  print(f"✅ Added {email}")
              else:
                  print(f"⚠️ {email} already subscribed")
          elif action == 'remove':
              original_count = len(data['subscribers'])
              data['subscribers'] = [sub for sub in data['subscribers'] if sub['email'].lower() != email.lower()]
              if len(data['subscribers']) < original_count:
                  print(f"✅ Removed {email}")
              else:
                  print(f"⚠️ {email} not found")
          
          with open('subscribers.json', 'w') as f:
              json.dump(data, f, indent=2)
          
          print(f"\n📊 Total subscribers: {len(data['subscribers'])}")
          EOF

      - name: Send welcome email (for new subscribers)
        if: github.event.inputs.action == 'add'
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL: ${{ github.event.inputs.email }}
        run: |
          echo "📧 Sending welcome email..."
          python3 scripts/send_welcome_email.py "$EMAIL" || echo "⚠️ Welcome email failed (non-blocking)"

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          if git diff --quiet subscribers.json 2>/dev/null; then
            echo "No changes to commit"
          else
            git add subscribers.json
            git commit -m "Update subscribers: ${{ github.event.inputs.action }} ${{ github.event.inputs.email }} [skip ci]"
            git push
            echo "✅ Changes committed"
          fi
