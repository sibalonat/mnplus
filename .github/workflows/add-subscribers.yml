name: Add Subscriber

# Manual workflow to manage blog subscribers
on:
  workflow_dispatch:
    inputs:
      email:
        description: 'Email address to add'
        required: true
        type: string
      action:
        description: 'Action to perform'
        required: true
        type: choice
        default: 'add'
        options:
          - add
          - remove

permissions:
  contents: write

jobs:
  update-subscribers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          token: ${{ secrets.WORKFLOW_TOKEN || github.token }}

      - name: Install GitHub CLI
        run: |
          type -p gh || (
            type -p curl >/dev/null || (sudo apt update && sudo apt install curl -y)
            curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
            sudo chmod go+r /usr/share/keyrings/githubcli-archive-keyring.gpg
            echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
            sudo apt update && sudo apt install gh -y
          )

      - name: Update subscribers secret
        env:
          EMAIL: ${{ github.event.inputs.email }}
          ACTION: ${{ github.event.inputs.action }}
          SUBSCRIBERS_JSON: ${{ secrets.SUBSCRIBERS_JSON }}
          GH_TOKEN: ${{ secrets.WORKFLOW_TOKEN || github.token }}
        run: |
          # Load current subscribers from secret (or start empty)
          echo "${SUBSCRIBERS_JSON:-{\"subscribers\":[]}}" > subscribers.json
          
          # Update the JSON
          python3 << 'EOF'
          import json
          import os
          from datetime import datetime
          
          email = os.environ['EMAIL'].strip()
          action = os.environ['ACTION']
          
          with open('subscribers.json', 'r') as f:
              data = json.load(f)
          
          if action == 'add':
              if not any(sub['email'].lower() == email.lower() for sub in data['subscribers']):
                  data['subscribers'].append({
                      'email': email,
                      'subscribedAt': datetime.now().strftime('%Y-%m-%d')
                  })
                  print(f"✅ Added {email}")
              else:
                  print(f"⚠️ {email} already subscribed")
          elif action == 'remove':
              original_count = len(data['subscribers'])
              data['subscribers'] = [
                  sub for sub in data['subscribers'] 
                  if sub['email'].lower() != email.lower()
              ]
              if len(data['subscribers']) < original_count:
                  print(f"✅ Removed {email}")
              else:
                  print(f"⚠️ {email} not found")
          
          with open('subscribers.json', 'w') as f:
              json.dump(data, f, indent=2)
          
          print(f"\n📊 Total subscribers: {len(data['subscribers'])}")
          EOF
          
          # Update GitHub secret with new data
          UPDATED_JSON=$(cat subscribers.json | tr -d '\n')
          gh secret set SUBSCRIBERS_JSON --body "$UPDATED_JSON"

      - name: Summary
        run: |
          echo "### ✅ Subscriber Update Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          python3 << 'EOF' >> $GITHUB_STEP_SUMMARY
          import json
          with open('subscribers.json', 'r') as f:
              data = json.load(f)
          print(f"**Total Subscribers:** {len(data['subscribers'])}")
          if data['subscribers']:
              print("\n**Recent Subscribers:**")
              for sub in data['subscribers'][-5:]:
                  print(f"- {sub['email']} (joined {sub['subscribedAt']})")
          EOF