name: Notify Subscribers of New Posts

on:
  push:
    branches: [main]
    paths:
      - 'posts/posts-metadata.json'
      - 'posts/**/*.md'

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install requests

      - name: Load subscribers from secret
        env:
          SUBSCRIBERS_JSON: ${{ secrets.SUBSCRIBERS_JSON }}
        run: |
          echo "${SUBSCRIBERS_JSON:-{\"subscribers\":[]}}" > subscribers.json
          SUBSCRIBER_COUNT=$(python3 -c "import json; data=json.load(open('subscribers.json')); print(len(data['subscribers']))")
          echo "subscriber_count=$SUBSCRIBER_COUNT" >> $GITHUB_OUTPUT
          echo "✅ Loaded $SUBSCRIBER_COUNT subscribers"
        id: load_subscribers

      - name: Send notifications
        if: steps.load_subscribers.outputs.subscriber_count != '0'
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: python scripts/notify_subscribers.py

      - name: Skip notification
        if: steps.load_subscribers.outputs.subscriber_count == '0'
        run: echo "⚠️ No subscribers yet"