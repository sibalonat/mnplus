name: Notify Subscribers of New Posts

on:
  push:
    branches: [main]
    paths:
      - "posts/posts-metadata.json"
      - "posts/**/*.md"
  schedule:
    # Daily at 07:00 UTC (09:00 Europe/Tirane in summer) —
    # releases posts scheduled for today that were pushed earlier.
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Notification mode"
        type: choice
        options:
          - push-diff
          - scheduled
        default: push-diff

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          # Full history: scheduled mode needs to know when a post was added
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install requests

      - name: Check subscribers file
        run: |
          if [ -f "subscribers.json" ]; then
            SUBSCRIBER_COUNT=$(python3 -c "import json; data=json.load(open('subscribers.json')); print(len(data['subscribers']))")
            echo "subscriber_count=$SUBSCRIBER_COUNT" >> $GITHUB_OUTPUT
            echo "✅ Found $SUBSCRIBER_COUNT subscribers in file"
          else
            echo "subscriber_count=0" >> $GITHUB_OUTPUT
            echo "⚠️ No subscribers.json file found"
          fi
        id: load_subscribers

      - name: Send notifications
        if: steps.load_subscribers.outputs.subscriber_count != '0'
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: python scripts/notify_subscribers.py ${{ (github.event_name == 'schedule' || inputs.mode == 'scheduled') && '--scheduled' || '' }}

      - name: Skip notification
        if: steps.load_subscribers.outputs.subscriber_count == '0'
        run: echo "⚠️ No subscribers yet"
