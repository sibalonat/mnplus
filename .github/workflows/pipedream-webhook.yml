name: Add Subscriber via Webhook

# Triggered by Pipedream webhook when someone subscribes
on:
  repository_dispatch:
    types: [formspark_submission]

permissions:
  contents: write

jobs:
  add-subscriber:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Add subscriber to list
        env:
          EMAIL: ${{ github.event.client_payload.email }}
        run: |
          python3 << 'EOF'
          import json
          import os
          from datetime import datetime
          
          email = os.environ.get('EMAIL', '').strip()
          
          if not email:
              print("❌ No email provided")
              exit(1)
          
          # Validate email format
          import re
          if not re.match(r'^[^\s@]+@[^\s@]+\.[^\s@]+$', email):
              print(f"❌ Invalid email format: {email}")
              exit(1)
          
          # Load or create subscribers.json
          try:
              with open('subscribers.json', 'r') as f:
                  data = json.load(f)
          except FileNotFoundError:
              data = {'subscribers': []}
              print("⚠️ subscribers.json not found, creating new file")
          
          # Check if email already exists (case-insensitive)
          if any(sub['email'].lower() == email.lower() for sub in data['subscribers']):
              print(f"⚠️ {email} is already subscribed (duplicate ignored)")
              exit(0)
          
          # Add new subscriber
          data['subscribers'].append({
              'email': email,
              'subscribedAt': datetime.now().strftime('%Y-%m-%d')
          })
          
          # Save updated data
          with open('subscribers.json', 'w') as f:
              json.dump(data, f, indent=2)
          
          print(f"✅ Successfully added {email}")
          print(f"📊 Total subscribers: {len(data['subscribers'])}")
          EOF

      - name: Send welcome email
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL: ${{ github.event.client_payload.email }}
        run: |
          echo "📧 Sending welcome email to $EMAIL..."
          if python3 scripts/send_welcome_email.py "$EMAIL"; then
            echo "✅ Welcome email sent successfully"
          else
            echo "❌ Warning: Welcome email failed to send"
            echo "Email was added to subscribers but welcome email delivery failed"
            echo "Check RESEND_API_KEY secret and Resend account status"
          fi

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          if git diff --quiet subscribers.json 2>/dev/null; then
            echo "No changes to commit"
          else
            git add subscribers.json
            git commit -m "Add subscriber via Pipedream webhook [skip ci]"
            git push
            echo "✅ New subscriber committed to repository"
          fi
