<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post - arra.blog</title>
    
    <!-- SEO Meta Tags (will be dynamically updated) -->
    <meta name="description" content="Read the latest post on arra.blog" id="meta-description" />
    <meta name="keywords" content="blog, technology, programming" id="meta-keywords" />
    <meta name="author" content="arra.blog" id="meta-author" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="article" />
    <meta property="og:url" content="" id="meta-og-url" />
    <meta property="og:title" content="Post - arra.blog" id="meta-og-title" />
    <meta property="og:description" content="Read the latest post on arra.blog" id="meta-og-description" />
    <meta property="og:site_name" content="arra.blog" />
    
    <!-- Twitter -->
    <meta property="twitter:card" content="summary" />
    <meta property="twitter:url" content="" id="meta-twitter-url" />
    <meta property="twitter:title" content="Post - arra.blog" id="meta-twitter-title" />
    <meta property="twitter:description" content="Read the latest post on arra.blog" id="meta-twitter-description" />
    
    <!-- Article metadata -->
    <meta property="article:published_time" content="" id="meta-published-time" />
    <meta property="article:author" content="" id="meta-article-author" />
    
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
    <div class="background-shapes">
        <div class="shape circle"></div>
        <div class="shape square"></div>
        <div class="shape triangle"></div>
    </div>

    <header>
        <div class="container">
            <div class="header-content">
                <h1 class="site-title"><a href="index.html" style="color: inherit; text-decoration: none;">[arra.blog]</a></h1>
                <p class="tagline">Breaking problems into elements</p>
            </div>
            <nav>
                <a href="index.html" class="nav-link">Home</a>
                <a href="index.html#blog" class="nav-link">Blog</a>
                <a href="index.html#about" class="nav-link">About</a>
            </nav>
        </div>
    </header>

    <main class="container">
        <article id="post-view" class="post-content">
            <a href="index.html" class="back-button" style="display: inline-block; margin-bottom: 2rem;">← Back to Blog</a>
            <div id="post-content">
                <p style="text-align: center; color: var(--text-light);">Loading post...</p>
            </div>
        </article>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2026 arra.blog - Breaking problems into elements</p>
        </div>
    </footer>

    <script>
        // Get post filename from URL parameter
        const urlParams = new URLSearchParams(window.location.search);
        const postFilename = urlParams.get('post');

        if (!postFilename) {
            document.getElementById('post-content').innerHTML = 
                '<p style="text-align: center; color: var(--text-light);">No post specified. <a href="index.html">Return to home</a></p>';
        } else {
            loadPostMetadata(postFilename);
            loadPost(postFilename);
        }

        // Load post metadata for SEO
        async function loadPostMetadata(filename) {
            try {
                const response = await fetch('posts/posts-metadata.json');
                if (!response.ok) return;
                
                const data = await response.json();
                const postMeta = data.posts.find(p => p.filename === filename);
                
                if (postMeta) {
                    updateSEOMeta(postMeta);
                }
            } catch (error) {
                console.error('Error loading post metadata:', error);
            }
        }

        // Update SEO meta tags
        function updateSEOMeta(post) {
            const baseUrl = 'https://sibalonat.github.io/mnplus/';
            const postUrl = baseUrl + 'post.html?post=' + post.filename;
            
            // Update title
            document.title = post.title + ' - arra.blog';
            
            // Update description
            const description = post.excerpt || post.title;
            document.getElementById('meta-description').setAttribute('content', description);
            document.getElementById('meta-og-description').setAttribute('content', description);
            document.getElementById('meta-twitter-description').setAttribute('content', description);
            
            // Update URLs
            document.getElementById('meta-og-url').setAttribute('content', postUrl);
            document.getElementById('meta-twitter-url').setAttribute('content', postUrl);
            
            // Update titles
            document.getElementById('meta-og-title').setAttribute('content', post.title);
            document.getElementById('meta-twitter-title').setAttribute('content', post.title);
            
            // Update author
            if (post.author) {
                document.getElementById('meta-author').setAttribute('content', post.author);
                document.getElementById('meta-article-author').setAttribute('content', post.author);
            }
            
            // Update published date
            if (post.date) {
                document.getElementById('meta-published-time').setAttribute('content', post.date);
            }
            
            // Add canonical link
            let canonical = document.querySelector('link[rel="canonical"]');
            if (!canonical) {
                canonical = document.createElement('link');
                canonical.setAttribute('rel', 'canonical');
                document.head.appendChild(canonical);
            }
            canonical.setAttribute('href', postUrl);
        }

        async function loadPost(filename) {
            try {
                const response = await fetch(`posts/${filename}`);
                if (!response.ok) {
                    throw new Error('Failed to load post');
                }
                const markdown = await response.text();
                const html = marked.parse(markdown);

                document.getElementById('post-content').innerHTML = html;
                
                // Update page title
                const firstHeading = document.querySelector('#post-content h1');
                if (firstHeading) {
                    document.title = firstHeading.textContent + ' - arra.blog';
                }

                // Execute any scripts that were in the markdown
                executeScripts();
            } catch (error) {
                console.error('Error loading post:', error);
                document.getElementById('post-content').innerHTML = 
                    '<p style="text-align: center; color: var(--text-light);">Failed to load post. <a href="index.html">Return to home</a></p>';
            }
        }

        // Execute script tags that were inserted via innerHTML
        function executeScripts() {
            const scripts = document.getElementById('post-content').querySelectorAll('script');
            scripts.forEach(oldScript => {
                const newScript = document.createElement('script');
                
                // Copy all attributes
                Array.from(oldScript.attributes).forEach(attr => {
                    newScript.setAttribute(attr.name, attr.value);
                });
                
                // Copy inline script content
                if (oldScript.textContent) {
                    newScript.textContent = oldScript.textContent;
                }
                
                // Replace old script with new one (this causes execution)
                oldScript.parentNode.replaceChild(newScript, oldScript);
            });
        }
    </script>
</body>
</html>
