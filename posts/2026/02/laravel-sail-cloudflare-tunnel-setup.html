    <script>
      // Animated favicon (inline version with corrected paths for nested directories)
      (function () {
        'use strict';
        const frames = [
          '../../../favicon-frame1.png',
          '../../../favicon-frame2.png',
          '../../../favicon-frame3.png',
          '../../../favicon-frame3.png',
          '../../../favicon-frame2.png',
        ];
        let currentFrame = 0;
        function updateFavicon() {
          const oldLink = document.querySelector("link[rel='icon']");
          if (oldLink) oldLink.remove();
          const link = document.createElement('link');
          link.rel = 'icon';
          link.type = 'image/png';
          link.href = frames[currentFrame];
          document.head.appendChild(link);
          currentFrame = (currentFrame + 1) % frames.length;
        }
        setInterval(updateFavicon, 400);
      })();
    </script>

    </main>

    <footer>
      <div class="container">

      </div>
    </footer>

    <script>
      // Post metadata (embedded at build time)
      const POST_FILENAME = 'laravel-sail-cloudflare-tunnel-setup.md';

      // Load and render the markdown post
      async function loadPost() {
        try {
          const response = await fetch(`../../${POST_FILENAME}`);
          if (!response.ok) {
            throw new Error('Failed to load post');
          }
          const markdown = await response.text();
          const html = marked.parse(markdown);

          document.getElementById('post-content').innerHTML = html;

          // Execute any scripts that were in the markdown
          executeScripts();
        } catch (error) {
          console.error('Error loading post:', error);
          document.getElementById('post-content').innerHTML =
            '<p style="text-align: center; color: var(--text-light);">Failed to load post. <a href="../../../index.html">Return to home</a></p>';
        }
      }

      // Execute script tags that were inserted via innerHTML
      function executeScripts() {
        const scripts = document
          .getElementById('post-content')
          .querySelectorAll('script');
        scripts.forEach((oldScript) => {
          const newScript = document.createElement('script');

          // Copy all attributes
          Array.from(oldScript.attributes).forEach((attr) => {
            // Fix relative paths for scripts (we're in /posts/YYYY/MM/)
            if (attr.name === 'src' && attr.value.startsWith('posts/')) {
              newScript.setAttribute(attr.name, '../../../' + attr.value);
            } else {
              newScript.setAttribute(attr.name, attr.value);
            }
          });

          // Copy inline script content
          if (oldScript.textContent) {
            newScript.textContent = oldScript.textContent;
          }

          // Replace old script with new one (this causes execution)
          oldScript.parentNode.replaceChild(newScript, oldScript);
        });
      }

      // Load post on page load
      document.addEventListener('DOMContentLoaded', loadPost);
    </script>
  </body>
